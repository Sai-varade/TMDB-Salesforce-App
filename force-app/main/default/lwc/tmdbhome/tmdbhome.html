<template>

        <div class="Search-div">
            <div class="Search-box">
                <div class="searchText">
                    <p class="t">Search</p>
                    <p class="t">By ⏷</p>
                </div>
                <p class="d">|</p>
                <input  class="inputText" type="text" placeholder="Search Here..."  onchange={Handlechnage}>
                <p class="searchlogo">🔍︎</p>
            </div >
            <template if:true={searchResult}>
                <div class="searchResult">
            <template for:each={searchResults} for:item="result">
                <div key={result.Id} data-id={result.Id} onclick={movieRecordPage} class="search-result">
                    <p >{result.Name}</p>
                </div>
            </template>
            </div>
        </template>
        </div>


        
        
    <div class="movie-grid">
        <template if:true={movies}>
            <template for:each={movies} for:item="movie">
                <div key={movie.Id} data-id={movie.Id} onclick={movieRecordPage} class="movie-card">

                    <div class="formatted-rich-text-container">
                        <lightning-formatted-rich-text value={movie.Poster__c}></lightning-formatted-rich-text>
                    </div>
   
                    <div class="movie-title">
                        <h2>{movie.Name}</h2>
                    </div>
                </div>
            </template>
        </template>
    </div>


    <div class="botton-div">
        <button class="movie-btn" onclick={handleclickPrevious}>{previous}</button>
        <button class="movie-btn">{PageNo}</button>
        <button class="movie-btn" onclick={handleclickNext}>{next}</button>
    </div>
</template>

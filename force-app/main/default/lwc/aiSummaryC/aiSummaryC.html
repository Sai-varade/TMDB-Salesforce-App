<template>
    <div>
        <lightning-card title="AI Summary...">
            <div class="textSummary">
            <template if:true={Summary}>
                <p>{Summary}</p>
            </template>
            <template if:false={Summary}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </template>
            <div class="btn-div">
                <lightning-button label="Refresh" onclick={handleRefresh}></lightning-button>
            </div>
            </div>
        </lightning-card>
    </div>
</template>
